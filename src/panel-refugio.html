<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptaAmigo - Panel del refugio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
  <div id="app-header"></div>

  <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full">
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Panel del Rescatista / Refugio</h2>
      <p class="text-sm text-gray-500">Gestión de animales y publicaciones</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8 text-center">
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
        <span id="metric-total-pets" class="text-3xl font-bold text-emerald-600">0</span>
        <p class="text-xs text-gray-500 mt-1">Animales Publicados</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
        <span id="metric-total-apps" class="text-3xl font-bold text-emerald-600">0</span>
        <p class="text-xs text-gray-500 mt-1">Solicitudes Recibidas</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
        <span class="text-3xl font-bold text-emerald-600">12</span>
        <p class="text-xs text-gray-500 mt-1">Adopciones Exitosas</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm mb-8">
      <h3 class="font-bold text-gray-800 mb-4 text-lg">➕ Publicar nuevo animal</h3>
      <form onsubmit="addNewPet(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input id="add-nombre" type="text" placeholder="Nombre (Ej. Toby)" required class="border p-2 rounded-lg text-sm">
        <select id="add-especie" class="border p-2 rounded-lg text-sm">
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
        </select>
        <input id="add-edad" type="text" placeholder="Edad (Ej. 2 años)" required class="border p-2 rounded-lg text-sm">
        <input id="add-ubicacion" type="text" placeholder="Ubicación (Ej. Lima)" required class="border p-2 rounded-lg text-sm">
        <input id="add-img" type="url" placeholder="URL de la imagen" required class="border p-2 rounded-lg text-sm md:col-span-2">
        <textarea id="add-desc" placeholder="Descripción de la mascota..." required class="border p-2 rounded-lg text-sm md:col-span-2" rows="2"></textarea>
        <button type="submit" class="bg-emerald-600 text-white font-semibold py-2.5 rounded-lg md:col-span-2 hover:bg-emerald-700 transition">Agregar al Catálogo</button>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/app.js"></script>
  <script>
    initLayout('panel-refugio.html');
    requireLogin();

    document.getElementById('metric-total-pets').innerText = getMyPublishedPets().length;
    document.getElementById('metric-total-apps').innerText = getMyApps().length;

    function addNewPet(e) {
      e.preventDefault();
      const pets = getAllPets();
      pets.unshift({
        id: Date.now(),
        owner: getUser().email,
        nombre: document.getElementById('add-nombre').value,
        especie: document.getElementById('add-especie').value,
        edad: document.getElementById('add-edad').value,
        ubicacion: document.getElementById('add-ubicacion').value,
        img: document.getElementById('add-img').value,
        desc: document.getElementById('add-desc').value
      });
      savePets(pets);
      alert('¡Mascota agregada al catálogo!');
      window.location.href = 'catalogo.html';
    }
  </script>
</body>
</html>
