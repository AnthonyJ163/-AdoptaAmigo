<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptaAmigo - Crear cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
  <div id="app-header"></div>

  <main class="flex-grow max-w-md mx-auto px-4 py-16 w-full">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center space-y-6">
      <h2 class="text-2xl font-bold text-gray-800">Crear cuenta</h2>
      <p class="text-sm text-gray-500">Únete a la comunidad de adopción</p>
      <form onsubmit="handleRegister(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre Completo</label>
          <input id="reg-name" type="text" required placeholder="Juan Pérez" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Correo Electrónico</label>
          <input id="reg-email" type="email" required placeholder="correo@ejemplo.com" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
          <input id="reg-pass" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Confirmar contraseña</label>
          <input id="reg-pass2" type="password" required placeholder="Repite tu contraseña" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <p id="form-error" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-2"></p>
        <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 transition">Registrarse</button>
      </form>
      <p class="text-xs text-gray-500">¿Ya tienes cuenta? <a href="login.html" onclick="this.href='login.html'+location.search" class="text-emerald-600 font-semibold underline">Inicia sesión</a></p>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/app.js"></script>
  <script>
    initLayout('registro.html');
    function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('reg-pass').value;
      if (pass !== document.getElementById('reg-pass2').value) {
        showFormError('Las contraseñas no coinciden.');
        return;
      }
      const r = registerUser(
        document.getElementById('reg-name').value,
        document.getElementById('reg-email').value,
        pass
      );
      if (!r.ok) { showFormError(r.msg); return; }
      alert('¡Cuenta creada correctamente!');
      window.location.href = nextPage();
    }
  </script>
</body>
</html>
