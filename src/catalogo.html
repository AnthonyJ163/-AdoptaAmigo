<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptaAmigo - Animales en adopción</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
  <div id="app-header"></div>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
    <h2 class="text-3xl font-bold text-gray-900 mb-6">Animales en adopción</h2>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <div class="bg-white p-6 rounded-xl border border-gray-200 h-fit space-y-4 shadow-sm">
        <h3 class="font-bold text-gray-800 border-b pb-2">Filtros</h3>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Buscar por nombre</label>
          <input id="filter-search" type="text" oninput="applyFilters()" placeholder="Ej. Max..." class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Especie</label>
          <select id="filter-especie" onchange="applyFilters()" class="w-full border rounded-lg p-2 text-sm outline-none">
            <option value="todos">Todos</option>
            <option value="Perro">Perros</option>
            <option value="Gato">Gatos</option>
          </select>
        </div>
      </div>
      <div id="catalog-grid" class="lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/app.js"></script>
  <script>
    initLayout('catalogo.html');

    function renderCatalog(list) {
      const grid = document.getElementById('catalog-grid');
      if (list.length === 0) {
        grid.innerHTML = '<p class="col-span-3 text-gray-500 text-sm">No se encontraron mascotas que coincidan.</p>';
        return;
      }
      grid.innerHTML = list.map(p => `
        <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden flex flex-col justify-between">
          <img src="${p.img}" class="h-48 w-full object-cover">
          <div class="p-4 space-y-2">
            <h4 class="font-bold text-lg text-gray-800">${p.nombre}</h4>
            <p class="text-xs text-gray-500">${p.especie} · ${p.edad} · ${p.ubicacion}</p>
            <a href="detalle.html?id=${p.id}" class="block text-center w-full mt-2 border border-emerald-600 text-emerald-600 text-sm font-semibold py-2 rounded-lg hover:bg-emerald-50 transition">Ver detalles</a>
          </div>
        </div>`).join('');
    }

    function applyFilters() {
      const search = document.getElementById('filter-search').value.toLowerCase();
      const especie = document.getElementById('filter-especie').value;
      renderCatalog(getPets().filter(p =>
        p.nombre.toLowerCase().includes(search) &&
        (especie === 'todos' || p.especie === especie)
      ));
    }

    renderCatalog(getPets());
  </script>
</body>
</html>
