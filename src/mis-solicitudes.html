<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaptaAmigo - Mis solicitudes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
  <div id="app-header"></div>

  <main class="flex-grow max-w-4xl mx-auto px-4 py-10 w-full">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Mis Solicitudes de Adopción</h2>
    <div id="user-requests-list" class="space-y-4"></div>
  </main>

  <div id="app-footer"></div>
  <script src="js/app.js"></script>
  <script>
    initLayout('mis-solicitudes.html');
    requireLogin();

    const apps = getMyApps();
    const list = document.getElementById('user-requests-list');
    if (apps.length === 0) {
      list.innerHTML = '<p class="text-gray-500 text-sm">No has realizado ninguna solicitud todavía.</p>';
    } else {
      list.innerHTML = apps.map(app => `
        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
          <div class="flex items-center space-x-4">
            <img src="${app.pet.img}" class="w-14 h-14 rounded-lg object-cover">
            <div>
              <h4 class="font-bold text-gray-800">${app.pet.nombre}</h4>
              <p class="text-xs text-gray-500">Solicitado el ${app.date}</p>
            </div>
          </div>
          <span class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-semibold">${app.status}</span>
        </div>`).join('');
    }
  </script>
</body>
</html>
